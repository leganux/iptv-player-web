<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IPTV Web Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1115;
      color: #f5f5f5;
    }
    header {
      height: 64px;
      padding: 14px 20px;
      background: #171a21;
      border-bottom: 1px solid #2a2f3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    #accountInfo {
      font-size: 13px;
      color: #aeb4c0;
    }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 64px);
    }
    aside {
      background: #14171d;
      border-right: 1px solid #2a2f3a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .filters {
      padding: 12px;
      border-bottom: 1px solid #2a2f3a;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .tab-btn {
      margin: 0;
      background: #303744;
      padding: 10px;
    }
    .tab-btn.active {
      background: #2563eb;
    }
    #backToSeriesBtn {
      display: none;
      background: #4b5563;
    }
    input,
    select,
    button {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #303744;
      background: #1d222b;
      color: #fff;
      outline: none;
    }
    button {
      background: #2563eb;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      font-size: 12px;
      color: #aeb4c0;
      margin-top: 4px;
      line-height: 1.4;
    }
    #channels {
      overflow-y: auto;
      flex: 1;
    }
    .channel {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #242936;
      cursor: pointer;
    }
    .channel:hover {
      background: #202633;
    }
    .channel.active {
      background: #1e3a8a;
    }
    .channel img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      background: #050505;
      border-radius: 8px;
    }
    .channel-name {
      font-size: 14px;
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .channel-meta {
      font-size: 12px;
      color: #aeb4c0;
    }
    main {
      padding: 18px;
      overflow-y: auto;
    }
    .player-card {
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 14px;
    }
    video {
      width: 100%;
      max-height: 72vh;
      background: black;
      border-radius: 12px;
    }
    .player-info {
      margin-top: 14px;
    }
    .player-info h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .url-box {
      font-size: 12px;
      color: #aeb4c0;
      word-break: break-all;
      background: #10131a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2a2f3a;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .actions button {
      margin: 0;
      background: #303744;
    }
    .actions button:hover {
      background: #3f4858;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      aside {
        height: 52vh;
      }
      header {
        height: auto;
        display: block;
      }
      #accountInfo {
        margin-top: 8px;
      }
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>IPTV Web Player</h1>
    <div id="accountInfo">Cargando cuenta...</div>
  </header>
  <div class="layout">
    <aside>
      <div class="filters">
        <div class="tabs">
          <button class="tab-btn active" data-mode="live">Live TV</button>
          <button class="tab-btn" data-mode="vod">Películas</button>
          <button class="tab-btn" data-mode="series">Series</button>
        </div>
        <input id="searchInput" type="text" placeholder="Buscar canal..." />
        <select id="categorySelect">
          <option value="">Todas las categorías</option>
        </select>
        <select id="extensionSelect">
          <option value="m3u8" selected>Reproducir como .m3u8</option>
          <option value="ts">Reproducir como .ts</option>
        </select>
        <button id="backToSeriesBtn">← Volver a series</button>
        <button id="reloadBtn">Recargar</button>
        <div id="status" class="status">Inicializando...</div>
      </div>
      <div id="channels"></div>
    </aside>
    <main>
      <div class="player-card">
        <video id="video" controls autoplay playsinline></video>
        <div class="player-info">
          <h2 id="currentTitle">Selecciona un canal</h2>
          <div id="currentUrl" class="url-box">Aquí aparecerá la URL del stream.</div>
          <div class="actions">
            <button id="copyUrlBtn">Copiar URL</button>
            <button id="openUrlBtn">Abrir URL</button>
            <button id="stopBtn">Detener</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    /************************************************************
     * CONFIGURACIÓN DEL FRONTEND
     ************************************************************/
    const API_ACCOUNT = "/api/account";
    const API_LIVE_CATEGORIES = "/api/categories";
    const API_LIVE_CHANNELS = "/api/channels";
    const API_VOD_CATEGORIES = "/api/vod/categories";
    const API_VOD_STREAMS = "/api/vod/streams";
    const API_SERIES_CATEGORIES = "/api/series/categories";
    const API_SERIES = "/api/series";
    const MAX_RENDER = 700;

    /************************************************************
     * ESTADO
     ************************************************************/
    let currentMode = "live";
    let liveCategories = [];
    let liveChannels = [];
    let vodCategories = [];
    let vodStreams = [];
    let seriesCategories = [];
    let seriesList = [];
    let seriesEpisodes = [];
    let currentSeries = null;
    let loadedModes = { live: false, vod: false, series: false };
    let currentStreamUrl = "";
    let currentItemKey = null;
    let hls = null;

    /************************************************************
     * ELEMENTOS
     ************************************************************/
    const accountInfo = document.getElementById("accountInfo");
    const statusBox = document.getElementById("status");
    const channelsBox = document.getElementById("channels");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const extensionSelect = document.getElementById("extensionSelect");
    const backToSeriesBtn = document.getElementById("backToSeriesBtn");
    const reloadBtn = document.getElementById("reloadBtn");
    const video = document.getElementById("video");
    const currentTitle = document.getElementById("currentTitle");
    const currentUrl = document.getElementById("currentUrl");
    const copyUrlBtn = document.getElementById("copyUrlBtn");
    const openUrlBtn = document.getElementById("openUrlBtn");
    const stopBtn = document.getElementById("stopBtn");
    const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));

    /************************************************************
     * HELPERS
     ************************************************************/
    function cleanName(value) {
      return String(value || "")
        .replace(/\\u00e9/g, "é")
        .replace(/\\u00e1/g, "á")
        .replace(/\\u00ed/g, "í")
        .replace(/\\u00f3/g, "ó")
        .replace(/\\u00fa/g, "ú")
        .replace(/\s+/g, " ")
        .trim();
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    function getCurrentCategories() {
      if (currentMode === "live") return liveCategories;
      if (currentMode === "vod") return vodCategories;
      if (currentMode === "series") return seriesCategories;
      return [];
    }

    function getCurrentItems() {
      if (currentMode === "live") return liveChannels;
      if (currentMode === "vod") return vodStreams;
      if (currentMode === "series") {
        return currentSeries ? seriesEpisodes : seriesList;
      }
      return [];
    }

    function getCategoryName(categoryId) {
      const categories = getCurrentCategories();
      const category = categories.find((item) => String(item.category_id) === String(categoryId));
      return category ? cleanName(category.category_name) : "Sin categoría";
    }

    function getItemName(item) {
      if (currentMode === "series" && currentSeries) {
        return cleanName(item.title || `Episodio ${item.episode_num || "?"}`);
      }
      return cleanName(item.name || item.title || "Sin nombre");
    }

    function getItemId(item) {
      if (currentMode === "live") return item.stream_id;
      if (currentMode === "vod") return item.stream_id;
      if (currentMode === "series" && currentSeries) return item.id;
      return item.series_id;
    }

    function getItemIcon(item) {
      if (currentMode === "live") return item.stream_icon || "";
      if (currentMode === "vod") return item.stream_icon || "";
      if (currentMode === "series" && currentSeries) return item?.info?.movie_image || "";
      return item.cover || "";
    }

    function getItemCategoryId(item) {
      return item?.category_id || "";
    }

    function getDefaultExtension(item) {
      if (currentMode === "live") {
        return extensionSelect.value || "m3u8";
      }
      return extensionSelect.value || item?.container_extension || "mp4";
    }

    function buildItemMeta(item) {
      if (currentMode === "live") {
        return `ID: ${item.stream_id} · ${getCategoryName(item.category_id)}`;
      }
      if (currentMode === "vod") {
        const ext = item.container_extension || "mp4";
        return `ID: ${item.stream_id} · ${getCategoryName(item.category_id)} · .${ext}`;
      }
      if (currentMode === "series" && currentSeries) {
        const season = item.season || "?";
        const ep = item.episode_num || "?";
        const ext = item.container_extension || "mp4";
        return `T${season} · E${ep} · ID: ${item.id} · .${ext}`;
      }
      return `ID: ${item.series_id} · ${getCategoryName(item.category_id)}`;
    }

    function setStatusSummary(filteredCount, totalCount, wasLimited) {
      if (wasLimited) {
        statusBox.textContent = `Mostrando ${filteredCount} de ${totalCount} resultados (límite visual ${MAX_RENDER}).`;
        return;
      }
      statusBox.textContent = `Mostrando ${filteredCount} de ${totalCount} resultados.`;
    }

    function updateModeUi() {
      tabButtons.forEach((button) => {
        const isActive = button.dataset.mode === currentMode;
        button.classList.toggle("active", isActive);
      });

      if (currentMode === "live") {
        searchInput.placeholder = "Buscar canal...";
      } else if (currentMode === "vod") {
        searchInput.placeholder = "Buscar película...";
      } else {
        searchInput.placeholder = currentSeries ? "Buscar episodio..." : "Buscar serie...";
      }

      backToSeriesBtn.style.display = currentMode === "series" && currentSeries ? "block" : "none";
      renderExtensionOptions();
    }

    function renderExtensionOptions() {
      if (currentMode === "live") {
        extensionSelect.innerHTML = `
          <option value="m3u8" selected>Reproducir como .m3u8</option>
          <option value="ts">Reproducir como .ts</option>
        `;
        return;
      }

      extensionSelect.innerHTML = `
        <option value="">Usar extensión del proveedor</option>
        <option value="mp4">Forzar .mp4</option>
        <option value="mkv">Forzar .mkv</option>
        <option value="avi">Forzar .avi</option>
      `;
    }

    function renderCategories() {
      if (currentMode === "series" && currentSeries) {
        categorySelect.innerHTML = `<option value="">Episodios de la serie</option>`;
        categorySelect.disabled = true;
        return;
      }

      categorySelect.disabled = false;
      categorySelect.innerHTML = `<option value="">Todas las categorías</option>`;
      getCurrentCategories().forEach((category) => {
        const option = document.createElement("option");
        option.value = category.category_id;
        option.textContent = cleanName(category.category_name);
        categorySelect.appendChild(option);
      });
    }

    function renderItems() {
      const allItems = getCurrentItems();
      const search = searchInput.value.toLowerCase().trim();
      const categoryId = categorySelect.value;

      const filtered = allItems.filter((item) => {
        const name = getItemName(item).toLowerCase();
        const matchesSearch = !search || name.includes(search);

        if (currentMode === "series" && currentSeries) {
          return matchesSearch;
        }

        const itemCategoryId = getItemCategoryId(item);
        const matchesCategory = !categoryId || String(itemCategoryId) === String(categoryId);
        return matchesSearch && matchesCategory;
      });

      const visibleItems = filtered.slice(0, MAX_RENDER);
      channelsBox.innerHTML = "";

      if (visibleItems.length === 0) {
        channelsBox.innerHTML = `<div class="status" style="padding:12px;">No se encontraron resultados.</div>`;
        statusBox.textContent = "Sin resultados.";
        return;
      }

      visibleItems.forEach((item) => {
        const itemId = getItemId(item);
        const keyPrefix = currentMode === "series" && currentSeries ? "episode" : currentMode;
        const key = `${keyPrefix}:${itemId}`;

        const div = document.createElement("div");
        div.className = "channel";
        if (String(currentItemKey) === String(key)) {
          div.classList.add("active");
        }

        const logo = getItemIcon(item);
        div.innerHTML = `
          <img src="${logo}" onerror="this.style.display='none';" />
          <div>
            <div class="channel-name">${getItemName(item)}</div>
            <div class="channel-meta">${buildItemMeta(item)}</div>
          </div>
        `;

        div.addEventListener("click", async () => {
          await onSelectItem(item);
        });

        channelsBox.appendChild(div);
      });

      setStatusSummary(visibleItems.length, filtered.length, filtered.length > MAX_RENDER);
    }

    function stopCurrentPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function playM3u8(url) {
      if (Hls.isSupported()) {
        hls = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 30 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(console.error);
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("HLS error:", data);
        });
        return;
      }

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(console.error);
        return;
      }

      alert("Este navegador no soporta HLS. Prueba Safari, Chrome con HLS.js, VLC o IINA.");
    }

    function playDirect(url) {
      video.src = url;
      video.play().catch(console.error);
    }

    async function getLiveStreamUrl(streamId, extension) {
      const data = await fetchJson(`/api/stream/${streamId}?extension=${encodeURIComponent(extension)}`);
      return data.url;
    }

    async function getVodStreamUrl(streamId, extension) {
      const data = await fetchJson(`/api/vod/stream/${streamId}?extension=${encodeURIComponent(extension)}`);
      return data.url;
    }

    async function getSeriesStreamUrl(episodeId, extension) {
      const data = await fetchJson(`/api/series/stream/${episodeId}?extension=${encodeURIComponent(extension)}`);
      return data.url;
    }

    async function playSelectedItem(item) {
      try {
        const extension = getDefaultExtension(item);
        const name = getItemName(item);
        const keyPrefix = currentMode === "series" && currentSeries ? "episode" : currentMode;
        currentItemKey = `${keyPrefix}:${getItemId(item)}`;

        renderItems();
        currentTitle.textContent = name;
        currentUrl.textContent = "Obteniendo stream...";

        let url = "";
        if (currentMode === "live") {
          url = await getLiveStreamUrl(item.stream_id, extension || "m3u8");
        } else if (currentMode === "vod") {
          url = await getVodStreamUrl(item.stream_id, extension || "mp4");
        } else {
          url = await getSeriesStreamUrl(item.id, extension || "mp4");
        }

        currentStreamUrl = url;
        currentUrl.textContent = url;
        stopCurrentPlayer();

        if ((extension || "").toLowerCase() === "m3u8" || String(url).includes(".m3u8")) {
          playM3u8(url);
        } else {
          playDirect(url);
        }
      } catch (error) {
        console.error(error);
        currentUrl.textContent = "Error al reproducir contenido.";
      }
    }

    async function openSeriesEpisodes(seriesItem) {
      try {
        statusBox.textContent = "Cargando episodios...";
        const payload = await fetchJson(`/api/series/${seriesItem.series_id}/episodes`);
        currentSeries = seriesItem;
        seriesEpisodes = Array.isArray(payload?.episodes) ? payload.episodes : [];
        currentItemKey = null;
        searchInput.value = "";
        categorySelect.value = "";
        updateModeUi();
        renderCategories();
        renderItems();
      } catch (error) {
        console.error(error);
        statusBox.textContent = "No se pudieron cargar episodios.";
      }
    }

    function closeSeriesEpisodes() {
      currentSeries = null;
      seriesEpisodes = [];
      currentItemKey = null;
      searchInput.value = "";
      categorySelect.value = "";
      updateModeUi();
      renderCategories();
      renderItems();
    }

    async function onSelectItem(item) {
      if (currentMode === "series" && !currentSeries) {
        await openSeriesEpisodes(item);
        return;
      }
      await playSelectedItem(item);
    }

    async function loadAccount() {
      try {
        const data = await fetchJson(API_ACCOUNT);
        const status = data?.user_info?.status || "desconocido";
        const active = data?.user_info?.active_cons || "0";
        const max = data?.user_info?.max_connections || "?";
        accountInfo.textContent = `Cuenta: ${status} | Conexiones: ${active}/${max}`;
      } catch (error) {
        console.error(error);
        accountInfo.textContent = "No se pudo cargar la cuenta";
      }
    }

    async function ensureModeData(mode, force = false) {
      if (!force && loadedModes[mode]) {
        return;
      }

      if (mode === "live") {
        const [categories, channels] = await Promise.all([
          fetchJson(API_LIVE_CATEGORIES),
          fetchJson(API_LIVE_CHANNELS)
        ]);
        liveCategories = Array.isArray(categories) ? categories : [];
        liveChannels = Array.isArray(channels) ? channels : [];
      }

      if (mode === "vod") {
        const [categories, streams] = await Promise.all([
          fetchJson(API_VOD_CATEGORIES),
          fetchJson(API_VOD_STREAMS)
        ]);
        vodCategories = Array.isArray(categories) ? categories : [];
        vodStreams = Array.isArray(streams) ? streams : [];
      }

      if (mode === "series") {
        const [categories, series] = await Promise.all([
          fetchJson(API_SERIES_CATEGORIES),
          fetchJson(API_SERIES)
        ]);
        seriesCategories = Array.isArray(categories) ? categories : [];
        seriesList = Array.isArray(series) ? series : [];
      }

      loadedModes[mode] = true;
    }

    async function loadData(force = false) {
      try {
        const label = currentMode === "live" ? "canales" : currentMode === "vod" ? "películas" : "series";
        statusBox.textContent = `Cargando ${label}...`;
        await ensureModeData(currentMode, force);
        renderCategories();
        renderItems();
      } catch (error) {
        console.error(error);
        statusBox.textContent = "Error cargando datos. Revisa consola y configuración.";
      }
    }

    async function switchMode(mode) {
      if (mode === currentMode) {
        return;
      }
      currentMode = mode;
      currentSeries = null;
      seriesEpisodes = [];
      currentItemKey = null;
      searchInput.value = "";
      categorySelect.value = "";
      updateModeUi();
      await loadData(false);
    }

    /************************************************************
     * EVENTOS
     ************************************************************/
    copyUrlBtn.addEventListener("click", async () => {
      if (!currentStreamUrl) return;
      await navigator.clipboard.writeText(currentStreamUrl);
      alert("URL copiada");
    });

    openUrlBtn.addEventListener("click", () => {
      if (!currentStreamUrl) return;
      window.open(currentStreamUrl, "_blank");
    });

    stopBtn.addEventListener("click", () => {
      stopCurrentPlayer();
      currentTitle.textContent = "Reproducción detenida";
      currentUrl.textContent = "";
      currentItemKey = null;
      renderItems();
    });

    reloadBtn.addEventListener("click", async () => {
      await loadAccount();
      await loadData(true);
    });

    backToSeriesBtn.addEventListener("click", () => {
      closeSeriesEpisodes();
    });

    searchInput.addEventListener("input", renderItems);
    categorySelect.addEventListener("change", renderItems);

    tabButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        await switchMode(button.dataset.mode);
      });
    });

    /************************************************************
     * INIT
     ************************************************************/
    updateModeUi();
    loadAccount();
    loadData(false);
  </script>
</body>
</html>
